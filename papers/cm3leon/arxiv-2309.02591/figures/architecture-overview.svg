<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1119" viewBox="0 0 720 1119" role="img" aria-labelledby="title desc">
<title id="title">CM3Leon 混合序列生成（自绘，非原文图）</title>
<desc id="desc">仓库自绘：展示检索增强生成路径。；不启用检索时直接组织当前条件序列。；图像输出依靠离散图像码，不由 CLIP 生成。</desc>
