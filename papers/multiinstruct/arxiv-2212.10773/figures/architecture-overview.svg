<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1094" viewBox="0 0 720 1094" role="img" aria-labelledby="title desc">
<title id="title">MultiInstruct 的 OFA 实验路径（自绘，非原文图）</title>
